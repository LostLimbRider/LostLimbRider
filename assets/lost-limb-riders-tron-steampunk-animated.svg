<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Lost Limb Riders — Tron x Steampunk animated banner</title>
<desc id="desc">Animated cyan neon circuits, brass gears, sweeping digital scanlines, sparking motorcycle-wheel motif and glowing Lost Limb Riders lettering. The motto reads No One Is Left Behind. No One Stands Alone.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03070d"/><stop offset=".47" stop-color="#08151e"/><stop offset="1" stop-color="#110d12"/></linearGradient>
 <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6e3b1f"/><stop offset=".22" stop-color="#e8a764"/><stop offset=".48" stop-color="#754121"/><stop offset=".72" stop-color="#f9c582"/><stop offset="1" stop-color="#703518"/></linearGradient>
 <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ecffff"/><stop offset=".38" stop-color="#a4faff"/><stop offset=".56" stop-color="#14dcec"/><stop offset="1" stop-color="#0b6a89"/></linearGradient>
 <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7a341d"/><stop offset=".4" stop-color="#ffb05a"/><stop offset="1" stop-color="#ec5f32"/></linearGradient>
 <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f6ff" stop-opacity="0"/><stop offset=".45" stop-color="#00f6ff" stop-opacity=".03"/><stop offset=".5" stop-color="#98ffff" stop-opacity=".65"/><stop offset=".55" stop-color="#00f6ff" stop-opacity=".03"/><stop offset="1" stop-color="#00f6ff" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#1b7891" stroke-opacity=".18" stroke-width="1"/><circle cx="0" cy="0" r="1" fill="#34ddeb" opacity=".35"/></pattern>
 <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 .5H1200" stroke="#8ffaff" stroke-opacity=".08" stroke-width="1"/></pattern>
 <filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="smallGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
