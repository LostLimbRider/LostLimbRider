</defs>
<style><![CDATA[
 .rotateA{animation:clockwise 19s linear infinite}.rotateB{animation:counter 15s linear infinite}.rotateC{animation:clockwise 28s linear infinite}
 .pulsed{animation:bright 3s ease-in-out infinite}.pulse2{animation:bright 2.2s ease-in-out infinite .8s}
 .dash{stroke-dasharray:15 23;animation:race 2.8s linear infinite}.dashSlow{stroke-dasharray:5 19;animation:race 5s linear infinite}
 .scanner{animation:sweep 7s linear infinite}.sparkA{animation:spark 4s ease-out infinite}.sparkB{animation:spark 4s ease-out infinite 1.5s}.sparkC{animation:spark 4s ease-out infinite 3s}
 .flicker{animation:flicker 7s steps(1,end) infinite}.float{animation:float 4s ease-in-out infinite}
 @keyframes clockwise{to{transform:rotate(360deg)}}@keyframes counter{to{transform:rotate(-360deg)}}
 @keyframes bright{0%,100%{opacity:.52}50%{opacity:1}}
 @keyframes race{to{stroke-dashoffset:-152}}
 @keyframes sweep{from{transform:translateX(-1450px)}to{transform:translateX(1450px)}}
 @keyframes spark{0%,6%,100%{opacity:0;transform:scale(.3)}12%,20%{opacity:1;transform:scale(1)}27%{opacity:0;transform:scale(1.6)}}
 @keyframes flicker{0%,94%,96%,100%{opacity:1}95%,97%{opacity:.48}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
